spring:
  application:
    name: shop-api
  datasource:
    url: jdbc:postgresql://localhost:5433/orderpulse
    username: orderpulse
    password: orderpulse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info